<!DOCTYPE html>
<!--
DATA SOURCE PROMPT:

In Q1 2026 Russians imported 9% more electronics from outside of Russia
but the total money spent on those decreased by 10%. Overall the value of
the average purchase dropped by 18% to ₽57,700.

DATA POINTS (Q1 2026 vs Q1 2025):
- Import volume:         +9%
- Money spent:          -10%
- Avg purchase value:   -18%   (now ₽57,700)

Source: https://www.kommersant.ru/doc/8624476
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russians Buy More Electronics, Spend Less</title>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700"
          rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">

    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>

<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: Q1 2026</div>
        </div>

        <h1 class="tochnyi-title">
            Russians Buy More Electronics, Spend Less Per Purchase
        </h1>

        <p class="tochnyi-subtitle">
            Q1 2026 vs Q1 2025 electronics imports. Volume rose but the average ticket fell to ₽57,700 — consumers are choosing cheaper devices.
        </p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: <a href="https://www.kommersant.ru/doc/8624476" style="color: var(--tochnyi-blue);">Kommersant</a>
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">
                @delfoo.bsky.social
            </a>
        </div>

    </div>

    <script>
        am5.ready(function() {
            var root = Tochnyi.createRoot("chartdiv");

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                paddingLeft: 10,
                paddingRight: 10,
                layout: root.verticalLayout
            }));

            var data = [
                { category: "Import volume\n(units)",     value: 9,   label: "+9%" },
                { category: "Money spent\n(total ₽)",     value: -10, label: "−10%" },
                { category: "Avg purchase\n(₽57,700)",    value: -18, label: "−18%" }
            ];

            var xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "category",
                renderer: Tochnyi.createXRenderer(root, {
                    cellStartLocation: 0.15,
                    cellEndLocation: 0.85
                })
            }));
            xAxis.get("renderer").labels.template.setAll({
                fontSize: 18,
                textAlign: "center",
                oversizedBehavior: "wrap",
                maxWidth: 240
            });
            xAxis.data.setAll(data);

            var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                min: -25,
                max: 15,
                numberFormat: "#'%'",
                renderer: Tochnyi.createYRenderer(root)
            }));

            yAxis.children.unshift(am5.Label.new(root, {
                text: "Q1 2026 vs Q1 2025 CHANGE",
                rotation: -90,
                y: am5.p50,
                centerX: am5.p50,
                fontSize: 14,
                fontWeight: "600",
                fill: am5.color(0x666666)
            }));

            var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: "Change",
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "value",
                categoryXField: "category",
                sequencedInterpolation: true
            }));

            series.columns.template.setAll({
                width: am5.percent(75),
                cornerRadiusTL: 4,
                cornerRadiusTR: 4,
                cornerRadiusBL: 4,
                cornerRadiusBR: 4
            });

            // Red for declines, blue for the gain
            series.columns.template.adapters.add("fill", function(fill, target) {
                var v = target.dataItem && target.dataItem.get("valueY");
                return am5.color(v < 0 ? 0xcc0000 : 0x005bbb);
            });
            series.columns.template.adapters.add("stroke", function(stroke, target) {
                var v = target.dataItem && target.dataItem.get("valueY");
                return am5.color(v < 0 ? 0xcc0000 : 0x005bbb);
            });

            // Labels outside the bar end
            series.bullets.push(function(root, series, dataItem) {
                var v = dataItem.get("valueY");
                return am5.Bullet.new(root, {
                    locationY: 1,
                    sprite: am5.Label.new(root, {
                        text: dataItem.dataContext.label,
                        centerX: am5.p50,
                        centerY: v >= 0 ? am5.p100 : am5.p0,
                        dy: v >= 0 ? -8 : 8,
                        fontSize: 26,
                        fontWeight: "700",
                        fontFamily: "Mukta",
                        fill: am5.color(0x222222),
                        textAlign: "center"
                    })
                });
            });

            series.data.setAll(data);
            chart.appear(1000, 100);
        });
    </script>

</body>
</html>
