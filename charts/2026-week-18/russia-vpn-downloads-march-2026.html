<!DOCTYPE html>
<!--
DATA SOURCE PROMPT:

In March 2026 the 5 most popular VPNs in Russia on Google Play were
downloaded 9.2 million times — 1,300% higher than in March 2025.
Over the 12 months ending in March 2026 the total downloads were 35.7 million.

DATA POINTS:
- March 2025 downloads (top 5 VPNs):  ~0.66M  (derived: 9.2M / 14)
- March 2026 downloads (top 5 VPNs):  9.2M
- 12-month rolling total:             35.7M
- YoY growth:                         +1,300%

Source: https://www.kommersant.ru/doc/8624493
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian VPN Downloads Explode in 2026</title>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700"
          rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">

    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>

<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: March 2026</div>
        </div>

        <h1 class="tochnyi-title">
            Russian VPN Downloads Explode in 2026
        </h1>

        <p class="tochnyi-subtitle">
            Top 5 VPN apps on Google Play Russia, monthly downloads. The 12 months ending March 2026 saw 35.7 million downloads in total.
        </p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
            <div class="tochnyi-change-badge up corner">
                &#9650; 1,300%
                <div style="font-size: 11px; font-weight: 500; margin-top: -2px;">year-over-year</div>
            </div>
        </div>

        <div class="tochnyi-source">
            Source: <a href="https://www.kommersant.ru/doc/8624493" style="color: var(--tochnyi-blue);">Kommersant</a>
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">
                @delfoo.bsky.social
            </a>
        </div>

    </div>

    <script>
        am5.ready(function() {
            var root = Tochnyi.createRoot("chartdiv");

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                paddingLeft: 10,
                paddingRight: 10,
                layout: root.verticalLayout
            }));

            var data = [
                { category: "March 2025", value: 0.66, label: "0.66M" },
                { category: "March 2026", value: 9.2,  label: "9.2M" }
            ];

            var xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "category",
                renderer: Tochnyi.createXRenderer(root, {
                    cellStartLocation: 0.2,
                    cellEndLocation: 0.8
                })
            }));
            xAxis.get("renderer").labels.template.setAll({
                fontSize: 18,
                textAlign: "center"
            });
            xAxis.data.setAll(data);

            var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                min: 0,
                max: 10,
                numberFormat: "#'M'",
                renderer: Tochnyi.createYRenderer(root)
            }));

            yAxis.children.unshift(am5.Label.new(root, {
                text: "DOWNLOADS (MILLIONS)",
                rotation: -90,
                y: am5.p50,
                centerX: am5.p50,
                fontSize: 14,
                fontWeight: "600",
                fill: am5.color(0x666666)
            }));

            var series = Tochnyi.createColumnSeries(root, chart, {
                name: "Downloads",
                xAxis: xAxis,
                yAxis: yAxis,
                valueField: "value",
                categoryField: "category",
                showLabels: false
            });
            Tochnyi.applyBarColors(series);

            series.bullets.push(function(root, series, dataItem) {
                var index = series.dataItems.indexOf(dataItem);
                var barColor = series._tochnyiPalette[index % series._tochnyiPalette.length];
                var textColor = Tochnyi.isLightColor(barColor) ? Tochnyi.colors.black : 0xffffff;
                return am5.Bullet.new(root, {
                    locationY: 0.5,
                    sprite: am5.Label.new(root, {
                        text: dataItem.dataContext.label,
                        centerX: am5.p50,
                        centerY: am5.p50,
                        fontSize: 32,
                        fontWeight: "700",
                        fontFamily: "Mukta",
                        fill: am5.color(textColor),
                        textAlign: "center"
                    })
                });
            });

            // For the tiny March 2025 bar, place its label above the bar in dark text
            series.bullets.push(function(root, series, dataItem) {
                if (dataItem.get("valueY") >= 1) return null;
                return am5.Bullet.new(root, {
                    locationY: 1,
                    sprite: am5.Label.new(root, {
                        text: dataItem.dataContext.label,
                        centerX: am5.p50,
                        centerY: am5.p100,
                        dy: -8,
                        fontSize: 22,
                        fontWeight: "700",
                        fontFamily: "Mukta",
                        fill: am5.color(0x333333),
                        textAlign: "center"
                    })
                });
            });

            series.data.setAll(data);
            chart.appear(1000, 100);
        });
    </script>

</body>
</html>
